name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.label.name != 'ci:windows' && github.event.label.name != 'ci:hold' && 'unrelated-label' || 'validation' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-identity:
    name: Conventional commits and SemVer identity
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:windows' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      notes-base64: ${{ steps.identity.outputs.notes-base64 }}
      already-tagged: ${{ steps.identity.outputs.already-tagged }}
    steps:
      - name: Check out full history and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: Presentation.Electron/package-lock.json

      - name: Install locked release tooling
        working-directory: Presentation.Electron
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify release identity policy with isolated Git repositories
        working-directory: Presentation.Electron
        run: npm run test:release

      - name: Verify portable inventories, executable manifests and Windows paths
        working-directory: Presentation.Electron
        run: node --test tests/tooling/portable-package.test.cjs tests/tooling/portable-executable.test.cjs

      - name: Validate new conventional commits
        working-directory: Presentation.Electron
        run: npm run commits:check

      - name: Calculate version and plain text release notes
        id: identity
        working-directory: Presentation.Electron
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            node scripts/compute-release.cjs --sha "$SOURCE_COMMIT" --test-pr "$PR_NUMBER" --test-run "$GITHUB_RUN_NUMBER" --test-attempt "$GITHUB_RUN_ATTEMPT"
          else
            node scripts/compute-release.cjs --sha "$SOURCE_COMMIT"
          fi

  windows-checks:
    name: Build and isolated tests (Windows x64)
    needs: release-identity
    runs-on: windows-2025
    timeout-minutes: 40
    outputs:
      release-version: ${{ steps.release-metadata.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: Presentation.Electron/package-lock.json

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore pinned CSharpier formatter
        run: |
          dotnet tool restore --configfile NuGet.Config
          if ($LASTEXITCODE -ne 0) { throw 'CSharpier tool restore failed.' }

      - name: Set isolated output path
        run: |
          "CI_OUTPUT=$(Join-Path $env:RUNNER_TEMP 'ahk-manager-ci')" >> $env:GITHUB_ENV

      - name: Install locked frontend dependencies
        id: frontend-dependencies
        working-directory: Presentation.Electron
        run: |
          npm.cmd ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }

      - name: Calculate this build attempt's release identity
        id: release-metadata
        working-directory: Presentation.Electron
        env:
          RELEASE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Rerunning only a failed Windows job keeps the Ubuntu job's old
          # outputs. Calculate again so the package uses this run attempt.
          $identityArgs = @('--json', '--sha', $env:RELEASE_SOURCE_COMMIT)
          if ($env:GITHUB_EVENT_NAME -ceq 'pull_request') {
            $identityArgs += @('--test-pr', $env:PR_NUMBER, '--test-run', $env:GITHUB_RUN_NUMBER, '--test-attempt', $env:GITHUB_RUN_ATTEMPT)
          }
          $identityJson = & node.exe scripts/compute-release.cjs @identityArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release identity calculation failed.' }
          $identity = $identityJson | ConvertFrom-Json
          $notes = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($identity.notes))
          "AHK_RELEASE_VERSION=$($identity.version)" >> $env:GITHUB_ENV
          "AHK_RELEASE_NOTES_BASE64=$notes" >> $env:GITHUB_ENV
          "AHK_SOURCE_COMMIT=$($identity.commit)" >> $env:GITHUB_ENV
          "version=$($identity.version)" >> $env:GITHUB_OUTPUT

      - name: Check formatting and architecture boundaries
        if: ${{ !cancelled() && steps.frontend-dependencies.outcome == 'success' }}
        working-directory: Presentation.Electron
        run: |
          npm.cmd run format:check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting check failed. Run npm run format in Presentation.Electron.' }
          npm.cmd run architecture:check
          if ($LASTEXITCODE -ne 0) { throw 'Architecture boundaries failed.' }

      - name: Prepare read-only AutoHotkey version fixture
        id: ahk-fixture
        if: ${{ !cancelled() }}
        run: |
          New-Item -ItemType Directory -Path $env:CI_OUTPUT -ErrorAction Stop | Out-Null
          $archive = Join-Path $env:CI_OUTPUT 'AutoHotkey_2.0.30.zip'
          Invoke-WebRequest -Uri 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.30/AutoHotkey_2.0.30.zip' -OutFile $archive
          $expectedHash = '1e0ece7ecb2d5646e55758150472677996a57f9db5c83d2996d8b47b9e2f31a4'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) { throw 'AutoHotkey archive hash mismatch.' }
          # Discovery reads executable metadata here; no application or AHK script runs.
          $fixture = Join-Path $env:LOCALAPPDATA 'Programs/AutoHotkey/v2'
          if (Test-Path -LiteralPath $fixture) { throw 'AutoHotkey fixture destination must be absent.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $fixture
          $interpreter = Join-Path $fixture 'AutoHotkey64.exe'
          if (-not (Test-Path -LiteralPath $interpreter -PathType Leaf)) { throw 'AutoHotkey fixture is missing.' }

      - name: Restore locked backend and test dependencies
        id: backend-dependencies
        if: ${{ !cancelled() }}
        run: |
          dotnet restore Tests.Backend/Tests.Backend.csproj --locked-mode --configfile NuGet.Config -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed.' }

      - name: Check active Core, backend and test C# formatting
        if: ${{ !cancelled() && steps.backend-dependencies.outcome == 'success' }}
        working-directory: Presentation.Electron
        run: |
          node.exe scripts/format-dotnet.cjs --check Core Backend Tests.Backend
          if ($LASTEXITCODE -ne 0) { throw 'C# formatting check failed. Run npm run format:dotnet in Presentation.Electron.' }

      - name: Publish backend tests
        id: backend-publish
        if: ${{ !cancelled() && steps.backend-dependencies.outcome == 'success' }}
        run: |
          dotnet publish Tests.Backend/Tests.Backend.csproj -c Release -r win-x64 --self-contained true --no-restore -o "$env:CI_OUTPUT/test-bin"
          if ($LASTEXITCODE -ne 0) { throw 'Backend test publish failed.' }

      - name: Run backend contract and continuation checks
        id: backend-tests
        if: ${{ !cancelled() && steps.backend-publish.outcome == 'success' }}
        run: |
          & "$env:CI_OUTPUT/test-bin/Tests.Backend.exe" --backend --root "$env:CI_OUTPUT/backend" 2>&1 | Tee-Object -FilePath "$env:CI_OUTPUT/backend.log"
          if ($LASTEXITCODE -ne 0) { throw 'Backend checks failed.' }

      - name: Run core and startup policy checks
        if: ${{ !cancelled() && steps.backend-publish.outcome == 'success' && steps.ahk-fixture.outcome == 'success' }}
        run: |
          & "$env:CI_OUTPUT/test-bin/Tests.Backend.exe" --core --root "$env:CI_OUTPUT/core" 2>&1 | Tee-Object -FilePath "$env:CI_OUTPUT/core.log"
          if ($LASTEXITCODE -ne 0) { throw 'Core checks failed.' }

      - name: Run native identity regression checks
        if: ${{ !cancelled() && steps.backend-publish.outcome == 'success' && steps.ahk-fixture.outcome == 'success' }}
        run: |
          & "$env:CI_OUTPUT/test-bin/Tests.Backend.exe" --corrections --root "$env:CI_OUTPUT/corrections" 2>&1 | Tee-Object -FilePath "$env:CI_OUTPUT/corrections.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native regression checks failed.' }

      - name: Inspect Windows startup through WMI (read-only)
        if: ${{ !cancelled() && steps.backend-publish.outcome == 'success' }}
        run: |
          & "$env:CI_OUTPUT/test-bin/Tests.Backend.exe" --startup-inspection --root "$env:CI_OUTPUT/startup-inspection" 2>&1 | Tee-Object -FilePath "$env:CI_OUTPUT/startup-inspection.log"
          if ($LASTEXITCODE -ne 0) { throw 'Windows startup inspection failed.' }

      - name: Verify current-user identities through isolated Task Scheduler registration
        if: ${{ !cancelled() && steps.backend-publish.outcome == 'success' }}
        run: |
          & "$env:CI_OUTPUT/test-bin/Tests.Backend.exe" --startup-task-integration --root "$env:CI_OUTPUT/startup-task-integration" 2>&1 | Tee-Object -FilePath "$env:CI_OUTPUT/startup-task-integration.log"
          if ($LASTEXITCODE -ne 0) { throw 'Isolated Task Scheduler identity checks failed.' }

      - name: Typecheck frontend
        if: ${{ !cancelled() && steps.frontend-dependencies.outcome == 'success' }}
        working-directory: Presentation.Electron
        run: |
          npm.cmd run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Typecheck failed.' }

      - name: Verify release manifest and immutable publication policy with mocks
        if: ${{ !cancelled() }}
        run: |
          ./tools/Test-ReleaseTooling.ps1 -OutputRoot "$env:CI_OUTPUT/release-tooling-tests"
          ./tools/Test-TestReleaseTooling.ps1 -OutputRoot "$env:CI_OUTPUT/test-channel-tooling-tests"
          ./tools/Test-PortablePackageValidation.ps1 -OutputRoot "$env:CI_OUTPUT/portable-package-validation"

      - name: Run Node tests with actual backend snapshot fixtures
        if: ${{ !cancelled() && steps.frontend-dependencies.outcome == 'success' && steps.backend-tests.outcome == 'success' }}
        working-directory: Presentation.Electron
        run: |
          $env:AHK_HEADER_SNAPSHOT_INPUT = Join-Path $env:CI_OUTPUT 'backend/header-description-snapshot.json'
          $env:AHK_FOREGROUND_ARGUMENTS_INPUT = Join-Path $env:CI_OUTPUT 'backend/foreground-host-arguments.txt'
          $env:AHK_STARTUP_RECOVERY_INPUT = Join-Path $env:CI_OUTPUT 'backend/startup-recovery-snapshot.json'
          npm.cmd test -- --out "$env:CI_OUTPUT/node-tests" 2>&1 | Tee-Object -FilePath "$env:CI_OUTPUT/node-tests.log"
          if ($LASTEXITCODE -ne 0) { throw 'Node tests failed.' }

      - name: Build production frontend bundle
        id: frontend-build
        if: ${{ !cancelled() && steps.frontend-dependencies.outcome == 'success' }}
        working-directory: Presentation.Electron
        run: |
          npm.cmd run build -- --out "$env:CI_OUTPUT/frontend"
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }
          ../tools/Set-ReleaseBuildInfo.ps1 -FrontendRoot "$env:CI_OUTPUT/frontend" -Version $env:AHK_RELEASE_VERSION -Commit $env:AHK_SOURCE_COMMIT

      - name: Download verified Electron runtime
        id: electron-runtime
        if: ${{ !cancelled() && steps.frontend-dependencies.outcome == 'success' }}
        working-directory: Presentation.Electron
        run: |
          node.exe node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron runtime download failed.' }

      - name: Verify the production Electron update transport
        if: ${{ !cancelled() && steps.electron-runtime.outcome == 'success' }}
        run: |
          ./tools/Test-UpdateNetwork.ps1 -HarnessRoot "$env:CI_OUTPUT/update-network-harness" -OutputRoot "$env:CI_OUTPUT/update-network"

      - name: Test and capture Electron interface
        if: ${{ !cancelled() && steps.frontend-build.outcome == 'success' && steps.electron-runtime.outcome == 'success' }}
        run: |
          ./tools/Test-ElectronPresentation.ps1 -FrontendRoot "$env:CI_OUTPUT/frontend" -HarnessRoot "$env:CI_OUTPUT/presentation-harness" -OutputRoot "$env:CI_OUTPUT/presentation"

      - name: Publish production backend
        id: production-backend
        if: ${{ !cancelled() && steps.backend-dependencies.outcome == 'success' }}
        run: |
          dotnet publish Backend/AhkManager.Backend.csproj -c Release -r win-x64 --self-contained true --no-restore "-p:Version=$env:AHK_RELEASE_VERSION" "-p:SourceRevisionId=$env:AHK_SOURCE_COMMIT" -o "$env:CI_OUTPUT/backend-publish"
          if ($LASTEXITCODE -ne 0) { throw 'Backend publish failed.' }

      - name: Build and exercise the standalone portable GUI launcher
        id: portable-launcher
        if: ${{ !cancelled() && steps.frontend-build.outcome == 'success' }}
        run: |
          ./tools/Build-PortableLauncher.ps1 -OutputRoot "$env:CI_OUTPUT/portable-launcher" -Version $env:AHK_RELEASE_VERSION -IconPath "$env:CI_OUTPUT/frontend/app.ico"
          ./tools/Test-PortableLauncher.ps1 -LauncherPath "$env:CI_OUTPUT/portable-launcher/Bezoro.AhkManager.exe" -OutputRoot "$env:CI_OUTPUT/portable-launcher-tests"

      - name: Publish the standalone update host
        id: update-host
        if: ${{ !cancelled() && steps.production-backend.outcome == 'success' }}
        run: |
          dotnet restore UpdateHost/AhkManager.UpdateHost.csproj --locked-mode --configfile NuGet.Config -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Update host restore failed.' }
          node.exe Presentation.Electron/scripts/format-dotnet.cjs --check UpdateHost
          if ($LASTEXITCODE -ne 0) { throw 'Update host C# formatting check failed. Run npm run format:dotnet in Presentation.Electron.' }
          dotnet publish UpdateHost/AhkManager.UpdateHost.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false "-p:Version=$env:AHK_RELEASE_VERSION" "-p:SourceRevisionId=$env:AHK_SOURCE_COMMIT" -o "$env:CI_OUTPUT/backend-publish/update"
          if ($LASTEXITCODE -ne 0) { throw 'Update host publish failed.' }

      - name: Run isolated update host policy and recovery checks
        if: ${{ !cancelled() && steps.update-host.outcome == 'success' }}
        run: |
          & "$env:CI_OUTPUT/backend-publish/update/AhkManager.UpdateHost.exe" --self-test --root "$env:CI_OUTPUT/update-host-tests" 2>&1 | Tee-Object -FilePath "$env:CI_OUTPUT/update-host.log"
          if ($LASTEXITCODE -ne 0) { throw 'Update host policy checks failed.' }

      - name: Build the portable application payload
        id: application-build
        if: ${{ success() && steps.frontend-build.outcome == 'success' && steps.update-host.outcome == 'success' && steps.electron-runtime.outcome == 'success' }}
        working-directory: Presentation.Electron
        env:
          CSC_LINK: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          AHK_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        run: |
          $env:AHK_FRONTEND_DIST = Join-Path $env:CI_OUTPUT 'frontend'
          $env:AHK_BACKEND_DIST = Join-Path $env:CI_OUTPUT 'backend-publish'
          $env:AHK_PACKAGE_OUT = Join-Path $env:CI_OUTPUT 'application'
          npm.cmd run package -- --dir --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Portable application build failed.' }
          node.exe scripts/verify-portable-executable.cjs --file "$env:CI_OUTPUT/application/win-unpacked/Bezoro.AhkManager.exe" --version $env:AHK_RELEASE_VERSION --out "$env:CI_OUTPUT/application/portable-executable.json"
          if ($LASTEXITCODE -ne 0) { throw 'The real packaged executable must require administrator access and retain its exact release version.' }

      - name: Build the versioned portable ZIP from the exact application payload
        id: portable-build
        if: ${{ !cancelled() && steps.application-build.outcome == 'success' && steps.portable-launcher.outcome == 'success' }}
        run: |
          ./tools/Build-PortablePackage.ps1 -ApplicationRoot "$env:CI_OUTPUT/application/win-unpacked" -LauncherPath "$env:CI_OUTPUT/portable-launcher/Bezoro.AhkManager.exe" -OutputRoot "$env:CI_OUTPUT/portable" -Version $env:AHK_RELEASE_VERSION -Commit $env:AHK_SOURCE_COMMIT

      - name: Prepare and verify the versioned portable release manifest
        if: ${{ !cancelled() && steps.portable-build.outcome == 'success' }}
        run: |
          $notes = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:AHK_RELEASE_NOTES_BASE64))
          $portable = "$env:CI_OUTPUT/portable/AHK-Manager-$($env:AHK_RELEASE_VERSION)-Portable-x64.zip"
          $manifest = "$env:CI_OUTPUT/portable/ahk-manager-portable-release.json"
          ./tools/New-PortableReleaseManifest.ps1 -ArchivePath $portable -OutputPath $manifest -Version $env:AHK_RELEASE_VERSION -Commit $env:AHK_SOURCE_COMMIT -Notes $notes
          ./tools/Publish-GitHubRelease.ps1 -PortableArchivePath $portable -PortableManifestPath $manifest -Repository $env:GITHUB_REPOSITORY -Commit $env:AHK_SOURCE_COMMIT -ValidateOnly
          ./tools/Test-PortablePackage.ps1 -ArchivePath $portable -ManifestPath $manifest -OutputRoot "$env:CI_OUTPUT/portable-evidence"
          Get-FileHash -LiteralPath $portable -Algorithm SHA256 | Format-List | Out-File "$env:CI_OUTPUT/portable/SHA256.txt"

      - name: Build a separate coherent portable baseline for update and rollback
        id: portable-baseline
        if: ${{ !cancelled() && steps.portable-build.outcome == 'success' }}
        env:
          CSC_LINK: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          AHK_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        run: |
          ./tools/Build-PortableTestBaseline.ps1 -FrontendRoot "$env:CI_OUTPUT/frontend" -CandidateApplicationRoot "$env:CI_OUTPUT/application/win-unpacked" -OutputRoot "$env:CI_OUTPUT/portable-baseline" -Commit $env:AHK_SOURCE_COMMIT

      - name: Verify isolated publisher trust before starting real-app runners
        id: portable-signing
        if: ${{ !cancelled() && steps.portable-baseline.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          ./tools/Test-PortableSigningFixture.ps1 -ApplicationRoot "$env:CI_OUTPUT/portable-baseline/application/win-unpacked" -CandidateManifestPath "$env:CI_OUTPUT/portable/ahk-manager-portable-release.json" -BaselineManifestPath "$env:CI_OUTPUT/portable-baseline/package/ahk-manager-portable-release.json" -PublisherPolicyPath "$env:CI_OUTPUT/portable-baseline/package/publisher-policy.json" -OutputRoot "$env:CI_OUTPUT/portable-signing-fixture-tests"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-ci-evidence
          path: |
            ${{ runner.temp }}/ahk-manager-ci/*.log
            ${{ runner.temp }}/ahk-manager-ci/backend/**/*.json
            ${{ runner.temp }}/ahk-manager-ci/backend/*.txt
            ${{ runner.temp }}/ahk-manager-ci/startup-inspection/*.txt
            ${{ runner.temp }}/ahk-manager-ci/startup-task-integration/*.xml
            ${{ runner.temp }}/ahk-manager-ci/startup-task-integration/*.txt
            ${{ runner.temp }}/ahk-manager-ci/startup-task-integration/*.json
            ${{ runner.temp }}/ahk-manager-ci/startup-task-integration/*.log
            ${{ runner.temp }}/ahk-manager-ci/frontend/build-info.json
            ${{ runner.temp }}/ahk-manager-ci/application/portable-executable.json
            ${{ runner.temp }}/ahk-manager-ci/update-host-tests/*.json
            ${{ runner.temp }}/ahk-manager-ci/update-network/*.json
            ${{ runner.temp }}/ahk-manager-ci/release-tooling-tests/*.json
            ${{ runner.temp }}/ahk-manager-ci/test-channel-tooling-tests/*.json
            ${{ runner.temp }}/ahk-manager-ci/portable-evidence/*.json
            ${{ runner.temp }}/ahk-manager-ci/portable-launcher-tests/*.json
            ${{ runner.temp }}/ahk-manager-ci/portable-baseline/evidence/*.json
            ${{ runner.temp }}/ahk-manager-ci/portable-signing-fixture-tests/**/*.json
            ${{ runner.temp }}/ahk-manager-ci/portable-signing-fixture-tests/**/*.txt
            ${{ runner.temp }}/ahk-manager-ci/portable-signing-fixture-tests.stages.json
            ${{ runner.temp }}/ahk-manager-ci/portable-signing-fixture-tests.summary.json
            ${{ runner.temp }}/ahk-manager-ci/portable-package-validation/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload interface screenshots and assertions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-ui-evidence
          path: |
            ${{ runner.temp }}/ahk-manager-ci/presentation/*.png
            ${{ runner.temp }}/ahk-manager-ci/presentation/*.json
            ${{ runner.temp }}/ahk-manager-ci/presentation/*.log
            ${{ runner.temp }}/ahk-manager-ci/presentation/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the portable release family
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('windows-portable-test-{0}', github.run_attempt) || 'windows-portable' }}
          path: |
            ${{ runner.temp }}/ahk-manager-ci/portable/SHA256.txt
            ${{ runner.temp }}/ahk-manager-ci/portable/*Portable-x64.zip
            ${{ runner.temp }}/ahk-manager-ci/portable/ahk-manager-portable-release.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the test-only portable baseline
        if: ${{ !cancelled() && steps.portable-baseline.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-regression-baseline-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ahk-manager-ci/portable-baseline/package/*Portable-x64.zip
            ${{ runner.temp }}/ahk-manager-ci/portable-baseline/package/ahk-manager-portable-release.json
            ${{ runner.temp }}/ahk-manager-ci/portable-baseline/package/publisher-policy.json
          if-no-files-found: error
          retention-days: 14

  portable-updater:
    name: Portable updater (${{ matrix.location }})
    needs: windows-checks
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        location: [default, custom-data, foreign-root, download-cancel]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download the exact candidate release family
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('windows-portable-test-{0}', github.run_attempt) || 'windows-portable' }}
          path: portable-updater-candidate

      - name: Download the separately packaged test baseline
        if: ${{ matrix.location != 'default' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portable-regression-baseline-${{ github.run_attempt }}
          path: portable-updater-baseline

      - name: Set up Node for published baseline policy verification
        if: ${{ matrix.location == 'default' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: Presentation.Electron/package-lock.json

      - name: Prepare the pinned published 1.6.2 portable baseline
        if: ${{ matrix.location == 'default' }}
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          Push-Location Presentation.Electron
          try {
            npm.cmd ci --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Published baseline policy dependencies could not be restored.' }
          }
          finally { Pop-Location }
          $candidate = @(Get-ChildItem -LiteralPath 'portable-updater-candidate' -Filter '*Portable-x64.zip')
          if ($candidate.Count -ne 1) { throw 'Exactly one candidate portable archive is required.' }
          ./tools/Prepare-PublishedPortableBaseline.ps1 -CandidateArchive $candidate[0].FullName -CandidateManifest (Join-Path $candidate[0].DirectoryName 'ahk-manager-portable-release.json') -SourceCommit $env:SOURCE_COMMIT -OutputRoot (Join-Path $env:GITHUB_WORKSPACE 'portable-updater-baseline')

      - name: Exercise the selected portable updater scenario without installation
        env:
          TEST_LOCATION: ${{ matrix.location }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $baseline = @(Get-ChildItem -LiteralPath 'portable-updater-baseline' -Filter '*Portable-x64.zip')
          $candidate = @(Get-ChildItem -LiteralPath 'portable-updater-candidate' -Filter '*Portable-x64.zip')
          if ($baseline.Count -ne 1 -or $candidate.Count -ne 1) { throw 'Exactly one independently packaged baseline and candidate ZIP are required.' }
          $parameters = @{
            BaselineArchive = $baseline[0].FullName
            BaselineManifest = Join-Path $baseline[0].DirectoryName 'ahk-manager-portable-release.json'
            CandidateArchive = $candidate[0].FullName
            CandidateManifest = Join-Path $candidate[0].DirectoryName 'ahk-manager-portable-release.json'
            SourceCommit = $env:SOURCE_COMMIT
            OutputRoot = Join-Path $env:RUNNER_TEMP 'portable-updater-evidence'
            Scenario = $env:TEST_LOCATION
            PublishedBaseline = $env:TEST_LOCATION -ceq 'default'
          }
          ./tools/Test-PortableUpdater.ps1 @parameters

      - name: Upload portable admission, preservation and recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-updater-${{ matrix.location }}
          path: |
            ${{ runner.temp }}/portable-updater-evidence/**/*.json
            ${{ runner.temp }}/portable-updater-evidence/**/*.jsonl
            ${{ runner.temp }}/portable-updater-evidence/**/*.log
            ${{ runner.temp }}/portable-updater-evidence/**/*.txt
            ${{ runner.temp }}/portable-updater-evidence/**/*.png
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    name: Publish approved main release
    needs: [windows-checks, portable-updater]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'bezoro/ahk-manager' && needs.windows-checks.result == 'success' && needs.portable-updater.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Recognize an already published release without changing its assets
        id: existing-release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.windows-checks.outputs.release-version }}
          AHK_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        run: |
          $status = ./tools/Get-ReleasePublicationStatus.ps1 -Repository $env:GITHUB_REPOSITORY -Version $env:RELEASE_VERSION -Commit $env:GITHUB_SHA
          $published = $status -ceq 'Published'
          Write-Host "Release v$env:RELEASE_VERSION status: $status."
          "published=$($published.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Download the portable family approved by Windows CI
        if: ${{ steps.existing-release.outputs.published != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-portable
          path: release-artifacts

      - name: Publish immutable release assets
        if: ${{ steps.existing-release.outputs.published != 'true' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.windows-checks.outputs.release-version }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          AHK_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'release-artifacts'
          $parameters = @{
            PortableArchivePath = Join-Path $root "AHK-Manager-$($env:RELEASE_VERSION)-Portable-x64.zip"
            PortableManifestPath = Join-Path $root 'ahk-manager-portable-release.json'
            Repository = $env:GITHUB_REPOSITORY
            Commit = $env:GITHUB_SHA
          }
          $signed = ./tools/Sign-PortableRelease.ps1 -ArchivePath $parameters.PortableArchivePath -ManifestPath $parameters.PortableManifestPath
          if ($signed) { $parameters.PortableSignaturePath = Join-Path $root 'ahk-manager-portable-release.json.p7s' }
          ./tools/Publish-GitHubRelease.ps1 @parameters
